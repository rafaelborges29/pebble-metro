name: Set up Pebble build and emulator tools
description: Shared pinned toolchain for CI and release verification
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24.21.0'
        cache: npm
    - uses: astral-sh/setup-uv@v10.3.0
    - name: Install emulator runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsdl2-2.0-0 libglib2.0-0t64 libpixman-1-0 libpng16-16t64 \
          zlib1g libasound2t64 libpulse0 libsndio7.0
    - name: Install pinned Pebble tool and SDK
      shell: bash
      run: |
        uv tool install --python 3.13 --with libpebble2==0.0.31 pebble-tool==5.0.39
        export PATH="$(uv tool dir --bin):$PATH"
        echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
        pebble sdk install 4.33.1
        pebble sdk activate 4.33.1
    - shell: bash
      run: npm ci
    - shell: bash
      run: npx playwright install --with-deps --only-shell chromium
