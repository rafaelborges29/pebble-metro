name: Merge both watch reports
description: Produce the existing combined HTML and JUnit reports from both platform artifacts
inputs:
  artifact-prefix:
    description: Prefix of the two platform diagnostics artifacts
    default: emulator-e2e
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.22.2'
        cache: npm
    - shell: bash
      run: npm ci
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: ${{ inputs.artifact-prefix }}-*
        path: e2e-artifacts
    - name: Require and merge both platform reports
      shell: bash
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
      run: |
        mkdir -p blob-reports
        for platform in emery gabbro; do
          cp "e2e-artifacts/$ARTIFACT_PREFIX-$platform/blob-report/report-$platform.zip" "blob-reports/$platform.zip"
        done
        # Rendering a failed test report exits zero; callers must gate on job results.
        npx playwright merge-reports --config=playwright.config.ts blob-reports
    - name: Upload the combined report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact-prefix }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: error
        retention-days: 7
