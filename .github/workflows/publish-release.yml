name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or resume
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: metro-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and trusted release source using main's validator
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release.py validate "$RELEASE_TAG"

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub requires push access to list/read draft releases for candidate reuse.
    # This job runs only the validated main-derived source, never PR source.
    permissions:
      contents: write
    env:
      CI: 'true'
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pebble
        with:
          browser: 'false'
      - run: npm run typecheck
      - name: Reuse the frozen candidate when resuming a draft
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py restore "$RELEASE_TAG"
      - name: Build once
        if: steps.restore.outputs.restored != 'true'
        run: npm run check
      - name: Verify and freeze the candidate
        run: python3 tools/release.py package "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: candidate
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test:
    name: Verify watch (${{ matrix.platform }})
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [emery, gabbro]
    env:
      CI: 'true'
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pebble
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: dist
          merge-multiple: true
      - name: Install the frozen candidate path and validate provenance
        run: |
          test -s dist/provenance.json
          mkdir -p build
          cp dist/*.pbw "build/$(basename "$PWD").pbw"
          python3 tools/release.py package "$RELEASE_TAG"
      - uses: ./.github/actions/test-emulator
        with:
          platform: ${{ matrix.platform }}
          artifact-prefix: release-test-diagnostics
      - name: Check the tested bytes against frozen provenance again
        run: |
          test -s dist/provenance.json
          python3 tools/release.py package "$RELEASE_TAG"

  reports:
    needs: [resolve, test]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/merge-e2e
        with:
          artifact-prefix: release-test-diagnostics
      - name: Require both watch jobs to pass
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  publish:
    needs: [resolve, verify, test, reports]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          path: dist
          merge-multiple: true
      - name: Publish the verified bytes to Pebble, Rebble, then GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PEBBLE_FIREBASE_API_KEY: ${{ vars.PEBBLE_FIREBASE_API_KEY }}
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
          REBBLE_REFRESH_TOKEN: ${{ secrets.REBBLE_REFRESH_TOKEN }}
        run: python3 tools/release.py publish "$RELEASE_TAG"

  next-development:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Open the reviewed next-snapshot PR and dispatch its checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: python3 tools/release.py advance "$RELEASE_TAG"
