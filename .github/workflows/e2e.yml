name: Emulator E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      workers:
        description: Workers per watch runner (benchmark 2/3/4)
        type: choice
        options: ['2', '3', '4']
        default: '3'
      repeat:
        description: Complete suite repetitions (retries remain disabled)
        type: choice
        options: ['1', '2']
        default: '1'
      fully_parallel:
        description: Schedule independent tests within each watch project concurrently
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Watch (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [emery, gabbro]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pebble
      - name: Validate version metadata
        run: python3 tools/release.py check
      - name: Typecheck
        run: npm run typecheck
      - name: Test offline dev installer guards
        run: python3 -m unittest discover -s tools -p 'test_dev_install.py'
      - name: Build and verify dev package (no installation)
        run: |
          npm run build:dev
          python3 tools/release_package.py --dev build/metro-lisboa-dev.pbw
      - name: Build both targets from this revision
        run: npm run check
      - uses: ./.github/actions/test-emulator
        with:
          platform: ${{ matrix.platform }}
          workers: ${{ inputs.workers }}
          repeat: ${{ inputs.repeat || '1' }}
          fully-parallel: ${{ github.event_name != 'workflow_dispatch' || inputs.fully_parallel }}

  # Keep the existing required-check name and never hide a failed/skipped target.
  e2e:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/merge-e2e
      - name: Require both watch jobs to pass
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
