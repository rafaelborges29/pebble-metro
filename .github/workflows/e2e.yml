name: Emulator E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libglib2.0-0t64 libpixman-1-0 libpng16-16t64 \
            zlib1g libasound2t64 libpulse0 libsndio7.0
      - name: Install pinned Pebble tool and SDK
        run: |
          uv tool install --python 3.13 --with libpebble2==0.0.31 pebble-tool==5.0.39
          export PATH="$(uv tool dir --bin):$PATH"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          pebble sdk install 4.33.1
          pebble sdk activate 4.33.1
      - name: Validate locale generator
        run: python3 -m unittest discover -s tools
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and test Time 2 and Round 2 in real emulators
        run: npm run e2e
      - name: Upload reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-e2e
          path: |
            playwright-report/
            test-results/
            LICENSE
            THIRD_PARTY_NOTICES.md
            DATA_METHODS.md
            LICENSES/
            src/
            locales/
            tools/
            wscript
            e2e/
          if-no-files-found: ignore
          retention-days: 7
