name: Emulator E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # The combined navigation/layout/locale matrix has 52 serial emulator cases.
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test release publication without network or credentials
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - uses: ./.github/actions/setup-pebble
      - name: Validate version metadata
        run: python3 tools/release.py check
      - name: Build and test Time 2 and Round 2 in real emulators
        run: npm run e2e
      - name: Upload reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-e2e
          path: |
            playwright-report/
            test-results/
            LICENSE
            THIRD_PARTY_NOTICES.md
            DATA_METHODS.md
            LICENSES/
            src/
            locales/
            tools/
            wscript
            e2e/
          if-no-files-found: ignore
          retention-days: 7
